# PROJECT_LOCAL_SELF_RESEARCH_NOT_GOOGLE_OFFICIAL
#
# Kernel config fragment: USB 3.0 host + UVC (USB Video Class) + V4L2.
#
# These are the options needed for a standard UVC webcam on the ZCU104's
# USB3.0 (PS-GTR) connector to enumerate as /dev/videoN.
#
# Applies on top of the ZCU104 defconfig; PetaLinux merges fragments listed in
# the linux-xlnx bbappend's SRC_URI.

# --- USB host stack -------------------------------------------------------
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_ANNOUNCE_NEW_DEVICES=y
CONFIG_USB_DEFAULT_PERSIST=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PLATFORM=y
CONFIG_USB_XHCI_PCI=n
CONFIG_USB_STORAGE=y
CONFIG_USB_HID=y
CONFIG_USB_ACM=y

# --- USB3 PHY on the PS-GTR (DWC3) ---------------------------------------
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_DUAL_ROLE=n
CONFIG_USB_DWC3_HOST=y
CONFIG_PHY_XILINX_ZYNQMP=y

# --- Media / V4L2 ---------------------------------------------------------
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y

# --- UVC ------------------------------------------------------------------
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y
# YUYV-style uncompressed formats come from UVC itself; MJPEG from the camera
# is handled inside uvcvideo, no extra module needed.
CONFIG_VIDEOBUF2_VMALLOC=y

# --- Let the camera be used without X ------------------------------------
CONFIG_MEDIA_SUBDRV_AUTOSELECT=y
