# PROJECT_LOCAL_SELF_RESEARCH_NOT_GOOGLE_OFFICIAL
#
# Kernel config fragment: USB 3.0 host + UVC (USB Video Class) + V4L2.
#
# Goal: a standard UVC webcam on the ZCU104's USB3.0 (PS-GTR) connector must
# enumerate as /dev/videoN once Linux is up.
#
# This fragment is merged on top of the Xilinx ZynqMP defconfig
# (arch/arm64/configs/xilinx_zynqmp_defconfig) by the linux-xlnx bbappend.

# ---------------------------------------------------------------------------
# IMPORTANT: do NOT switch DWC3 to host-only mode.  Learned the hard way.
#
# Setting CONFIG_USB_DWC3_HOST=y with USB_DWC3_GADGET / USB_DWC3_DUAL_ROLE off
# breaks the link:
#
#   aarch64-xilinx-linux-ld.bfd: drivers/usb/dwc3/core.o: in function `dwc3_remove':
#   core.c:(.text+0x580): undefined reference to `dwc3_gadget_exit_hibernation'
#   core.c:(.text+0x86c): undefined reference to `dwc3_gadget_exit_hibernation'
#
# Why: the Xilinx kernel calls the gadget-only helper from core.c WITHOUT a
# CONFIG_USB_DWC3_GADGET guard --
#
#   drivers/usb/dwc3/core.c:2104   dwc3_gadget_exit_hibernation(dwc);  (dwc3_remove)
#   drivers/usb/dwc3/core.c:2399   dwc3_gadget_exit_hibernation(dwc);  (dwc3_suspend)
#
# both inside `#ifdef CONFIG_PM_SLEEP` -- while the definition lives in the
# gadget-only file drivers/usb/dwc3/gadget_hibernation.c.  Host-only therefore
# leaves the symbol undefined, and vmlinux fails to link.
#
# The Kconfig help for USB_DWC3_HOST even says "the gadget feature will be
# regressed", i.e. it is not the mode we want.
#
# Correct configuration = the defconfig default: DUAL_ROLE.  The MACHINE_NAME
# zcu104-revc board DTS already sets `dr_mode = "host"` on &dwc3_0, so the
# dual-role driver runs the controller as a host anyway.  Host behaviour comes
# from the device tree, not from the Kconfig mode.
# ---------------------------------------------------------------------------

# --- USB host stack -------------------------------------------------------
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_ANNOUNCE_NEW_DEVICES=y
CONFIG_USB_DEFAULT_PERSIST=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PLATFORM=y
CONFIG_USB_STORAGE=y
CONFIG_USB_HID=y
CONFIG_USB_ACM=y

# --- USB3 on the PS-GTR (Synopsys DWC3) -----------------------------------
# DUAL_ROLE is what the ZCU104 board DTS expects; host mode is selected by
# `dr_mode = "host"` there, NOT here.  Do not use USB_DWC3_HOST (see above).
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_DUAL_ROLE=y
CONFIG_PHY_XILINX_ZYNQMP=y

# --- Media / V4L2 ---------------------------------------------------------
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y

# --- UVC ------------------------------------------------------------------
# Uncompressed (YUYV) and MJPEG are both handled inside uvcvideo itself;
# no extra module is needed for either.
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y
CONFIG_VIDEOBUF2_VMALLOC=y

# --- Let the camera be used without X ------------------------------------
CONFIG_MEDIA_SUBDRV_AUTOSELECT=y
